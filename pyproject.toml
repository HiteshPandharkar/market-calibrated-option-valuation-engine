[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptionpricer"
version = "0.1.0"
description = "Extensible, market-calibrated option valuation engine"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ui = ["streamlit>=1.37,<2"]

[project.scripts]
price-option = "pyoptionpricer.cli:main"

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_upstox: opt-in tests that call the real Upstox API",
]

[tool.setuptools.packages.find]
where = ["src"]
